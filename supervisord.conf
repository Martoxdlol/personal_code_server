[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

[program:code-server]
; VS Code in the browser, served over plain HTTP on 8081 (no --cert). Opens
; /workspace as the workspace. Password auth is read from the
; CODE_SERVER_PASSWORD env var passed to the container.
command=code-server --bind-addr 0.0.0.0:8081 --auth password /workspace
environment=HOME="/root",PASSWORD="%(ENV_CODE_SERVER_PASSWORD)s"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
