# Standalone GPU variant of the stack (NVIDIA).
#
# This is a COMPLETE, self-contained compose file (not an override fragment),
# so it can be deployed on its own — e.g. Dokploy points its "Compose Path" at
# this file and runs `docker compose -f docker-compose.gpu.yml up`. Dokploy
# only reads a single compose file, so the override-layering approach
# (`-f docker-compose.yml -f docker-compose.gpu.yml`) does not work there.
#
# Locally you can use this the same way: `docker compose -f docker-compose.gpu.yml up -d --build`.
# For CPU-only local use, keep using the default `docker compose up` (docker-compose.yml).
#
# Requires the NVIDIA Container Toolkit + driver on the host (and an amd64 host,
# since the image's CUDA wheels are amd64-only). Verify with `nvidia-smi` on the
# host before deploying.
services:
  devbox:
    build:
      context: .
    container_name: devbox
    environment:
      # code-server reads PASSWORD directly. In Dokploy, set CODE_SERVER_PASSWORD
      # in the service's Environment settings; locally it comes from .env.
      - PASSWORD=${CODE_SERVER_PASSWORD:?set CODE_SERVER_PASSWORD in .env}
    ports:
      - "8081:8081" # code-server (VS Code web UI, HTTP)
    volumes:
      - ./src:/workspace
      - devbox-code-server:/root/.local/share/code-server
    restart: always
    # NVIDIA GPU reservation. Honored by `docker compose up` (Dokploy's Compose
    # mode); Docker Swarm / Stack mode would ignore this and need generic-resources.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  devbox-code-server:
